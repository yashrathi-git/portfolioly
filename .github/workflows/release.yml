name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for changesets to create PRs and releases
      pull-requests: write # Needed for changesets to create PRs
      id-token: write # Required for OIDC authentication with npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: Ensure npm 11.5.1 or later
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build publishable packages only
        run: |
          yarn workspace portfolioly-schema build
          yarn workspace portfolioly-template-components build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: yarn changeset publish
          version: .github/scripts/version-with-lockfile.sh
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN needed - using trusted publishing via OIDC
